<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliador de Currículos</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📄 Avaliador de Currículos</h1>

        <p class="subtitle">
            Analise seu currículo e receba uma pontuação baseada em critérios ATS.
        </p>

        <textarea
            id="resume"
            placeholder="Cole o texto do seu currículo aqui">
        </textarea>

        <button onclick="analyzeResume()">
            Analisar Currículo
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
